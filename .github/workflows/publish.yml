name: Publish npm release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Run this workflow from a v* tag." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@11.18.0
      - run: npm ci
      - run: npm run verify
      - name: Verify tag matches package version
        id: package
        run: |
          PACKAGE_VERSION="$(node --input-type=module -e "import packageJson from './package.json' with { type: 'json' }; process.stdout.write(packageJson.version)")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - run: npm publish --access public
      - name: Verify the published registry package
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run test:registry -- "${{ steps.package.outputs.version }}"; then
              exit 0
            fi
            if [[ "$attempt" == "5" ]]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
